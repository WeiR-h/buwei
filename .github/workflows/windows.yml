name: Windows source validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      CARGO_HOME: ${{ github.workspace }}/.run/cargo-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust with GNU target
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.98.0-x86_64-pc-windows-gnu
          'C:\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download pinned official dependencies
        run: python tools/bootstrap.py
      - name: Restore fixed dependency compilation cache
        uses: actions/cache@v4
        with:
          path: |
            .run/cargo-home/registry
            .run/cargo-home/git
            native/target
          key: windows-gnu-v3-${{ hashFiles('native/Cargo.lock', 'dependencies.lock.json', 'rust-toolchain.toml', 'tools/Build.ps1') }}
          restore-keys: windows-gnu-v3-
      - name: Check public source and history
        run: python tools/public_scan.py
      - name: Test and build complete official host
        shell: pwsh
        run: |
          ./tools/Build.ps1 -Tests
          ./tools/Build.ps1 -Release
          python -m unittest discover -s tools -p test_release_tools.py
      - name: Package and start on fresh Windows profile
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/package.py --binary native/target/release/buwei-rinx-dual-host.exe --destination .run/windows-package
          python tools/package_scan.py .run/windows-package --output .run/startup-evidence/package-privacy.json
          python tools/startup_check.py .run/windows-package --output .run/startup-evidence
      - name: Upload measured build logs and binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: |
            .run/windows-package/
            .run/startup-evidence/startup.json
            .run/startup-evidence/startup.png
            .run/startup-evidence/package-privacy.json
          if-no-files-found: error
  fresh-windows-runtime:
    needs: clean-windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview
          path: downloaded
      - name: Verify downloaded package without source or dependency checkout
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          if (Test-Path native) { throw 'Source unexpectedly present' }
          if (Test-Path .deps) { throw 'Dependency checkout unexpectedly present' }
          python downloaded/windows-package/tools/package_scan.py downloaded/windows-package --output .run/fresh-runtime/package-privacy.json
          python downloaded/windows-package/tools/startup_check.py downloaded/windows-package --output .run/fresh-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: fresh-windows-runtime
          path: |
            .run/fresh-runtime/startup.json
            .run/fresh-runtime/startup.png
            .run/fresh-runtime/package-privacy.json
          if-no-files-found: error
