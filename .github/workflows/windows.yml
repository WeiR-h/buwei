name: Windows source validation
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust with GNU target
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0-x86_64-pc-windows-gnu --profile minimal
          rustup default 1.98.0-x86_64-pc-windows-gnu
          'C:\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Download pinned official dependencies
        run: python tools/bootstrap.py
      - name: Check public source and history
        run: python tools/public_scan.py
      - name: Test and build complete official host
        shell: pwsh
        run: |
          ./tools/Build.ps1 -Tests
          ./tools/Build.ps1
      - name: Upload measured build logs and binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: windows-preview
          path: native/target/debug/buwei-rinx-dual-host.exe
          if-no-files-found: error
