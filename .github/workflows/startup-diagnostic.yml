name: Diagnose fresh native startup
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview
          run-id: 37034759066
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - name: Verify stack normalization on the actual previously compiled package
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          import json,pathlib,sys
          sys.path.insert(0,'tools')
          from pe_stack import normalize
          from startup_check import check
          p=next(pathlib.Path('downloaded').rglob('release.json')).parent
          result=normalize(p/'native/buwei-rinx-dual-host.exe')
          print(json.dumps(result))
          release=json.loads((p/'release.json').read_text('utf8'))
          release['native_binary_sha256']=result['binary_sha256']
          release['sha256']['native/buwei-rinx-dual-host.exe']=result['binary_sha256']
          release['diagnostic_only_post_link_stack_normalization']=True
          (p/'release.json').write_text(json.dumps(release,indent=2),'utf8')
          report=check(p,pathlib.Path('.run/stack-probe'))
          report['diagnostic_only']=True
          report['stack_normalization']=result
          pathlib.Path('.run/stack-probe/diagnostic.json').write_text(json.dumps(report,indent=2),'utf8')
          print(json.dumps(report))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-startup-diagnostic
          path: |
            .run/stack-probe/startup.json
            .run/stack-probe/diagnostic.json
            .run/stack-probe/startup.png
