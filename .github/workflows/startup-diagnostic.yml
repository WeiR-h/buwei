name: Diagnose fresh native startup
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Windows build run containing the original windows-preview artifact'
        required: true
        type: string
        default: '38328375695'
permissions:
  contents: read
  actions: read
jobs:
  diagnostic:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded
      - name: Recheck the original runtime and normal exit without changing its binary
        shell: pwsh
        env:
          MAKEPAD_FORCE_SOFTWARE_GPU: '1'
          BUWEI_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          @'
          import json,os,pathlib,sys
          sys.path.insert(0,'tools')
          from package_scan import scan
          from startup_check import check
          p=next(pathlib.Path('downloaded').rglob('release.json')).parent
          integrity=scan(p)
          assert integrity['passed'], 'Original package integrity failed'
          report=check(p,pathlib.Path('.run/stack-probe'),show_window=True)
          report['diagnostic_only']=True
          report['source_run_id']=os.environ['BUWEI_SOURCE_RUN_ID']
          report['original_binary_unchanged']=True
          pathlib.Path('.run/stack-probe/diagnostic.json').write_text(json.dumps(report,indent=2),'utf8')
          print(json.dumps(report))
          '@ | python -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stack-startup-diagnostic
          path: |
            .run/stack-probe/startup.json
            .run/stack-probe/diagnostic.json
            .run/stack-probe/startup.png
